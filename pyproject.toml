[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitewise"
version = "0.1.0"
description = "Análisis municipal para comparar ubicaciones empresariales en España"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
    "numpy>=2.2",
    "pandas>=2.3",
    "scikit-learn>=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

# Añadir las dependencias de cada módulo al implementarlo y acordar su bloqueo.
