[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitewise"
version = "0.1.0"
description = "Análisis municipal para comparar ubicaciones empresariales en España"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
    "numpy>=2.2",
    "pandas>=2.3",
    "scikit-learn>=1.7",
]
agent = [
    "pandas>=2.3",
    "pydantic>=2",
    "groq>=1.7",
    "python-dotenv>=1.2",
    "langgraph",
    "langchain>=1.5",
    "langchain-chroma>=1.1",
    "chromadb>=1.5",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pandas>=2.3",
    "pydantic>=2",
]
db = [
    "psycopg[binary]>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

# Añadir las dependencias de cada módulo al implementarlo y acordar su bloqueo.